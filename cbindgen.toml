language = "C"
header = "/* Authlas C ABI. Generated by cbindgen from crates/authlas-capi. Do not edit. */"
include_guard = "AUTHLAS_H"
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true

[export]
include = ["AuthlasBuf", "AuthlasReplay", "AuthlasStatus"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
