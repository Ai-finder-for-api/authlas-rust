name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL 3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake

      - name: Install OpenSSL 3 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install OpenSSL 3 (Windows, vcpkg)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
        with:
          vcpkgGitCommitId: "319504a5326aa870edde46438c5455fa76305a56"
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json

      - name: Set OpenSSL location (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "OPENSSL_DIR=${{ github.workspace }}/vcpkg_installed/x64-windows" >> "$GITHUB_ENV"

      - name: Test (all features, Rust core, C ABI and C++ transport)
        run: cargo test --release --no-default-features --features backend-awslc,capi,net
        if: runner.os != 'Windows'

      - name: Test (Windows, OpenSSL backend)
        if: runner.os == 'Windows'
        run: cargo test --release --no-default-features --features backend-openssl,capi,net

  package:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install OpenSSL 3
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Verify the published package builds
        run: cargo package --no-default-features --features backend-awslc,capi,net
